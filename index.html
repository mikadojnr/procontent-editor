<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProContent Editor Demo</title>
    <link rel="stylesheet" href="frontend/src/styles/main.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 20px;
        }
        
        #editor {
            min-height: 600px;
        }
        
        .footer {
            background: #f9f9f9;
            border-top: 1px solid #e0e0e0;
            padding: 15px 20px;
            text-align: center;
            font-size: 12px;
            color: #666;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        #save-btn {
            background: #667eea;
            color: white;
        }
        
        #save-btn:hover {
            background: #5568d3;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        #clear-btn {
            background: #e0e0e0;
            color: #333;
        }
        
        #clear-btn:hover {
            background: #d0d0d0;
        }
        
        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
        }
        
        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ProContent Editor</h1>
            <p>A production-ready WYSIWYG rich text editor</p>
        </div>
        
        <div class="content">
            <div id="editor"></div>
            
            <div class="button-group">
                <button id="save-btn">Save Content</button>
                <button id="clear-btn">Clear</button>
            </div>
            
            <div id="status" class="status"></div>
        </div>
        
        <div class="footer">
            <p>ProContent Editor v1.0 • <a href="https://github.com/mikadojnr/procontent-editor" target="_blank">GitHub Repository</a></p>
        </div>
    </div>

    <script src="frontend/src/core/editor.js"></script>
    <script>
        // Initialize editor
        const editor = new ProContentEditor('#editor', {
            height: 600,
            plugins: [],
            theme: 'light',
            autosave: false,
            spellcheck: true
        });

        // Add sample content
        editor.setContent({
            blocks: [
                {
                    type: 'heading',
                    data: {
                        content: 'Welcome to ProContent Editor'
                    }
                },
                {
                    type: 'paragraph',
                    data: {
                        content: 'Start editing your content here. Use the toolbar above to format text, add images, create tables, and more.'
                    }
                }
            ]
        });

        // Save button
        document.getElementById('save-btn').addEventListener('click', () => {
            const content = editor.getContent();
            console.log('Content saved:', content);
            
            // Show success message
            const status = document.getElementById('status');
            status.textContent = '✓ Content saved successfully!';
            status.className = 'status success';
            
            setTimeout(() => {
                status.className = 'status';
            }, 3000);
            
            // Log to console as JSON
            console.log(JSON.stringify(content, null, 2));
        });

        // Clear button
        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Are you sure you want to clear all content?')) {
                editor.blocks = [];
                editor.editorContainer.innerHTML = '';
                editor.saveHistory();
                
                const status = document.getElementById('status');
                status.textContent = '✓ Content cleared!';
                status.className = 'status success';
                
                setTimeout(() => {
                    status.className = 'status';
                }, 3000);
            }
        });

        // Keyboard shortcut help
        console.log('%c ProContent Editor Keyboard Shortcuts:', 'font-size: 14px; font-weight: bold;');
        console.log('%c Ctrl+B: Bold | Ctrl+I: Italic | Ctrl+U: Underline | Ctrl+Z: Undo | Ctrl+Y: Redo | Ctrl+/: Slash Commands', 'font-size: 12px;');
    </script>
</body>
</html>
