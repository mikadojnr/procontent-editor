version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: procontent_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: procontent
      MYSQL_USER: procontent
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - procontent

  php:
    image: php:8.1-fpm
    container_name: procontent_php
    working_dir: /app
    volumes:
      - .:/app
      - ./php.ini:/usr/local/etc/php/php.ini
    ports:
      - "9000:9000"
    networks:
      - procontent
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: procontent_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/app
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - procontent
    depends_on:
      - php

  python:
    image: python:3.10
    container_name: procontent_python
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    networks:
      - procontent
    command: python -m flask run --host=0.0.0.0

volumes:
  mysql_data:

networks:
  procontent:
    driver: bridge
